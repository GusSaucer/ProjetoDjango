{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KeroTech</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- CSS Oficial da Aplicação -->
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="login-viewport">

<main class="login-card-container p-3">
  <!-- Utiliza a mesma classe dos cards do catálogo -->
  <div class="card-product p-4 p-sm-5 shadow-lg">
    
    <!-- Cabeçalho KeroTech -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center gap-2 mb-2">
        <i class="bi bi-emoji-smile fs-1 text-tech-green"></i>
        <h2 class="brand-title fs-2 mb-0">KeroTech</h2>
      </div>
      <p class="text-secondary small mb-0">Confira nossos itens disponíveis em estoque.</p>
    </div>

    <!-- Django Messages (Alerts padronizados com style.css) -->
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-error text-center mb-3" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    {% if form.errors %}
      <div class="alert alert-error text-center mb-3" role="alert">
        Usuário ou senha inválidos.
      </div>
    {% endif %}

    <!-- Formulário de Login -->
    <form method="POST" action="">
      {% csrf_token %}

      <!-- Campo Usuário -->
      <div class="mb-3">
        <label for="username" class="form-label small fw-semibold text-secondary">Usuário</label>
        <div class="d-flex align-items-center login-input-group">
          <span class="login-input-icon">
            <i class="bi bi-person"></i>
          </span>
          <input type="text" name="username" id="username" class="form-control login-input-field" placeholder="Digite seu usuário" required autofocus>
        </div>
      </div>

      <!-- Campo Senha -->
      <div class="mb-4">
        <label for="password" class="form-label small fw-semibold text-secondary">Senha</label>
        <div class="d-flex align-items-center login-input-group">
          <span class="login-input-icon">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" name="password" id="password" class="form-control login-input-field" placeholder="Digite sua senha" required>
        </div>
      </div>

      <!-- Botão Acessar (Mesmo estilo verde CTA dos cards) -->
      <button type="submit" class="btn btn-tech-buy w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <!-- Rodapé -->
    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
      <a href="{% url 'produtos' %}" class="small d-inline-flex align-items-center"[cite: 1, 2]>
        <i class="bi bi-arrow-left me-1"></i> Voltar ao Catálogo
      </a>
    </div>

  </div>
</main>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
