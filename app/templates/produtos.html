<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
</head>
<body>
    <h1>Nossos Produtos:</h1>
    <ul class="card">
        {% for i in produtos %}
        <li>
        <h2>{{i.nome}}</h2>
        <h3>Valor: R${{i.preco}}</h3>
        <p>Qtd. em estoque: {{i.estoque}}</p>
        </li>
        {% endfor %}
    </ul>
    
</body>
</html>
